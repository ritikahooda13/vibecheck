<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIBECHECK Admin</title><link rel="stylesheet" href="/styles.css"><style>
.admin-wrap{max-width:900px;margin:55px auto;padding:0 22px}.admin-card{background:#11182b;border:1px solid #ffffff1b;border-radius:18px;padding:26px;margin:18px 0}.admin-card h1,.admin-card h2{font-family:"Space Grotesk"}.admin-input{width:100%;max-width:360px;padding:13px;border-radius:10px;border:1px solid #ffffff30;background:#080d1b;color:white;margin:8px 0 15px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:18px;background:#ffffff08;border-radius:13px}.stat b{display:block;font:700 30px "Space Grotesk";margin-top:7px}.muted{color:#95a0b8;font-size:12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}td,th{text-align:left;padding:12px;border-bottom:1px solid #ffffff14}th{color:#9eafff}@media(max-width:600px){.stats{grid-template-columns:1fr}}
</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark">V</span><span>VIBE<span class="accent">CHECK</span></span></a><a class="small-link" href="/">← Website</a></header>
<main class="admin-wrap"><section id="loginBox" class="admin-card"><h1>Admin dashboard</h1><p class="muted">Sign in to view quiz activity and result analytics.</p><form id="loginForm"><input id="password" class="admin-input" type="password" placeholder="Admin password" required><br><button class="primary-btn">Sign in ↗</button></form><p id="loginError" class="muted"></p></section>
<section id="dashboard" class="hidden"><div class="admin-card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><h1>Overview</h1><p class="muted">VIBECHECK quiz activity</p></div><button id="logout" class="secondary-btn">Log out</button></div><div class="stats"><div class="stat"><span class="muted">All-time attempts</span><b id="total">0</b></div><div class="stat"><span class="muted">Today</span><b id="today">0</b></div><div class="stat"><span class="muted">Personality types</span><b id="types">4</b></div></div></div>
<div class="admin-card"><h2>Result breakdown</h2><div id="breakdown" class="muted">Loading…</div></div><div class="admin-card"><h2>Recent quiz attempts</h2><div class="table-wrap"><table><thead><tr><th>ID</th><th>Result</th><th>Language</th><th>Date (UTC)</th></tr></thead><tbody id="recent"></tbody></table></div></div></section></main>
<script>
const $=id=>document.getElementById(id);async function check(){const r=await fetch("/api/admin/me");const d=await r.json();$("loginBox").classList.toggle("hidden",d.authenticated);$("dashboard").classList.toggle("hidden",!d.authenticated);if(d.authenticated)load();}
async function load(){const r=await fetch("/api/admin/stats");if(!r.ok){check();return;}const d=await r.json();$("total").textContent=d.total;$("today").textContent=d.today;$("types").textContent=d.results.length;$("breakdown").innerHTML=d.results.length?d.results.map(x=>`<p>${x.type.replaceAll("_"," ")} <strong style="float:right">${x.count}</strong></p>`).join(""):"No quiz attempts yet."; $("recent").innerHTML=d.recent.map(x=>`<tr><td>${x.id}</td><td>${x.type.replaceAll("_"," ")}</td><td>${x.language}</td><td>${x.createdAt}</td></tr>`).join("");}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();const r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("password").value})});if(r.ok){$("loginError").textContent="";check();}else $("loginError").textContent="Login failed. Check your password.";});
$("logout").addEventListener("click",async()=>{await fetch("/api/admin/logout",{method:"POST"});check();});check();
</script></body></html>
